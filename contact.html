<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Kaif Shaikh</title>
    <meta name="description" content="Get in touch with Kaif Shaikh for development inquiries, collaborations, or feedback on the Link Hub project.">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>

    <a href="#main-content" class="skip-link">Skip to main content</a>

    <header>
        <div class="logo">Kaif Shaikh</div>
        <nav aria-label="Main Navigation">
            <ul>
                <li><a href="./index.html">Home</a></li>
                <li><a href="./about.html">About</a></li>
                <li><a href="./contact.html" aria-current="page">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main id="main-content">
        <section aria-labelledby="contact-heading">
            <h1 id="contact-heading">Contact Me</h1>
            <p>Have an idea to expand the Link Hub, or want to collaborate on a new project? Reach out using the accessible contact form below.</p>
            
            <form action="#" method="POST" class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name (Required)</label>
                    <input type="text" id="name" name="name" required aria-required="true" autocomplete="name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address (Required)</label>
                    <input type="email" id="email" name="email" required aria-required="true" autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="message">Your Message (Required)</label>
                    <textarea id="message" name="message" rows="5" required aria-required="true"></textarea>
                </div>

                <button type="submit">Submit Message</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Kaif Shaikh. All rights reserved.</p>
    </footer>

</body>
</html>
